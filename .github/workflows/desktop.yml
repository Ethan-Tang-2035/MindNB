name: Desktop verification
on:
  workflow_dispatch:
  pull_request:
    paths: ['src/**', 'desktop/**', 'tests/**', 'scripts/**', 'mcp/**', 'server/**', 'api/**', 'public/**', 'build/**', 'tsconfig.json', 'vite.config.ts', 'package*.json', 'playwright.*.config.ts', '.github/workflows/desktop.yml']
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-results
          retention-days: 3
          path: test-results/web/
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Configure Windows desktop test resolution
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - run: npx install-electron --no
      - run: npm run typecheck
      - run: npm run build:desktop
      - run: npm test
        env:
          MINDNB_TEST_NATIVE: '1'
      - run: npx playwright test --config playwright.desktop.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-results-${{ matrix.os }}
          retention-days: 3
          path: test-results/
