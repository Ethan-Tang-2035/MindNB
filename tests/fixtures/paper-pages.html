<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MindNB · 纸页功能验收</title><style>body{margin:0;background:#f4f5ee;color:#304132;font:15px/1.7 system-ui}main{max-width:920px;margin:8vh auto;padding:28px}small{color:#738466;letter-spacing:2px}h1{font-size:38px;margin:18px 0}p{color:#72806d;max-width:660px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:36px}button{font:inherit;color:inherit;text-align:left;padding:25px;background:#fffef9;border:1px solid #dbe1d2;border-radius:12px;cursor:pointer;min-height:145px}button:hover{border-color:#71945d;box-shadow:0 8px 24px #324d3012}button strong{display:block;font-size:18px;margin-bottom:9px}button span{font-size:13px;color:#7d8976}.meta{font-size:12px;margin-top:28px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}h1{font-size:28px}}</style><main><small>MINDNB / PAPER PAGES</small><h1>把想法，装进纸页。</h1><p>以下示例打开的是正式编辑器。你可以继续编辑、移动整页、撤销、保存和按页导出。每次打开创建一份独立示例。</p><div class="grid"><button data-case="journal"><strong>01　手账与封面</strong><span>三页并排 · 导图、插画、表格与笔迹混排</span></button><button data-case="overflow"><strong>02　内容越界</strong><span>显示、裁切、自动扩页三种行为</span></button><button data-case="overlap"><strong>03　重叠与归属</strong><span>移动纸页只带走属于它的内容</span></button><button data-case="empty"><strong>04　空画布与空页</strong><span>从“插入 → 纸页”开始整理</span></button><button data-case="failure"><strong>05　资源加载失败</strong><span>缺少图片时阻止导出，支持重试</span></button><button data-case="mixed"><strong>06　混合尺寸导出</strong><span>A4、3:4、方图、横图与自定义</span></button></div><p class="meta">入口：顶部「＋ → 纸页」 · 顶部「纸页」列表 · 选中纸页后的右侧设置 · 「导出 → 按页导出图片 / PDF」。</p><p id="status" role="status"></p></main><script type="module">
import {emptyTree,createNode,newId} from '/src/model.ts';import {createDocStore} from '/src/docs.ts';import {createPage,assignToPage,updatePage} from '/src/paper-pages.ts';import {createTable} from '/src/content.ts';
const status=document.querySelector('#status');
function note(text,x,y,size=22,extra={}){const node=createNode(text);node.style={fontSize:size,shape:'none',width:570,...extra};return{node,x,y}}
function build(kind){let map=emptyTree();map.visualStyle='clear';map.paper='#e9ede4';map.paperStyle='blank';map.font='sans';map.ink='#304333';map.root.text='把想法\n装进纸页';map.root.style={fontSize:64,shape:'none',width:650,color:'#304333'};map.rootPosition={x:405,y:280};map.topics=[];map.objects=[];
const pages=[];for(const [index,preset]of(kind==='mixed'?['a4','a4h','portrait','square','wide','custom']:['portrait','a4','portrait']).entries()){const made=createPage(map,{x:index*875,y:0,preset});map=made.map;const names=['封面 · 思维手账','读书 · 把知识连起来','行动 · 每周复盘'];map=updatePage(map,made.id,{name:names[index]??`尺寸示例 ${index+1}`,paper:index===2?'#203c32':index===0?'#fff8e8':'#ffffff',paperStyle:index===1?'dots':'blank',...(preset==='custom'?{w:900,h:500}:{})});pages.push(made.id)}
map=assignToPage(map,pages[0],[map.root.id]);
const add=(topic,index)=>{map.topics.push(topic);map=assignToPage(map,pages[index],[topic.node.id])};
add(note('MIND NOTES  /  2026',125,100,15,{color:'#80956c'}),0);add(note('一本会生长的思维手账',135,425,26),0);add(note('自由记录  /  分页整理  /  一次导出',135,925,17,{color:'#80956c'}),0);
map.objects.push({id:newId(),seed:1,kind:'image',src:'/illustrations/scenes/sources/reading.svg',x:230,y:540,w:340,h:280});map=assignToPage(map,pages[0],[map.objects.at(-1).id]);
add(note('从读懂，到真正用起来',970,85,32,{width:600}),1);const tree=note('阅读',970,285,26,{shape:'rounded',fill:'#e4edcf',width:150});tree.node.structure='right';tree.node.children=['提炼：一句话核心观点','连接：与哪些经验有关','行动：下一步怎么做'].map((t,i)=>{const n=createNode(t);n.style={fontSize:22,width:300,fill:['#ecedd5','#e9efe8','#faf0dd'][i],color:'#35462e'};return n});add(tree,1);
const table=createTable(965,670);table.cells=[['本周阅读','一句话记录','下一步'],['设计心理学','让操作看得见','审视常用工具'],['原子习惯','小改变持续积累','先做两分钟']];table.columnWidths=[150,240,210];table.w=600;table.h=120;map.objects.push(table);map=assignToPage(map,pages[1],[table.id]);add(note('整理好思路，随时回来接着写。',975,955,18,{color:'#80956c'}),1);
add(note('每一页\n都是新的开始',1855,135,49,{width:570}),2);add(note('本周的一点进步',1855,425,24),2);const todo=note('继续做',1855,585,24,{shape:'rounded',fill:'#dce7c6',width:150});todo.node.structure='right';todo.node.children=['留下一条想法','完成一件小事','给自己一点空间'].map(t=>{const n=createNode(t);n.style={fontSize:21,width:270,shape:'none'};return n});add(todo,2);
const ink={id:newId(),kind:'ink',seed:8,x:1870,y:950,w:360,h:60,sourceWidth:360,sourceHeight:60,strokes:[{id:newId(),color:'#a7c993',width:5,opacity:.9,points:Array.from({length:36},(_,i)=>({x:i*10,y:30+Math.sin(i*.3)*10}))}]};map.objects.push(ink);map=assignToPage(map,pages[2],[ink.id]);
if(kind==='overflow'){map=updatePage(map,pages[1],{w:440,h:500,overflow:'show'});map=updatePage(map,pages[2],{w:480,h:600,overflow:'clip'})}
if(kind==='overlap'){map=updatePage(map,pages[1],{x:450,y:250});map=updatePage(map,pages[2],{x:950,y:420})}
if(kind==='empty'){map=emptyTree();map.root.text='先自由记录，再加纸页';map.visualStyle='clear'}
if(kind==='failure'){map.objects.push({id:newId(),kind:'image',seed:9,src:'/paper-pages-missing-image.png',x:1110,y:530,w:200,h:100});map=assignToPage(map,pages[1],[map.objects.at(-1).id])}
return map}
for(const button of document.querySelectorAll('[data-case]'))button.onclick=async()=>{try{status.textContent='正在创建正式编辑器示例…';const kind=button.dataset.case,map=build(kind);for(const obj of map.objects??[])if(obj.kind==='image'&&obj.src.endsWith('/reading.svg')){const img=new Image();img.src=obj.src;await img.decode();const cv=document.createElement('canvas');cv.width=680;cv.height=560;cv.getContext('2d').drawImage(img,0,0,680,560);obj.src=cv.toDataURL('image/png')}const store=createDocStore(localStorage),meta=store.create();store.save(meta.id,map);store.rename(meta.id,'纸页示例 · '+button.querySelector('strong').textContent.slice(3));location.href='/#/doc/'+meta.id}catch(e){status.textContent='无法创建示例：'+e.message}};
</script></html>
